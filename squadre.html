<body data-pagina="squadre" class="bg-acc-carta text-acc-inchiostro antialiased overflow-x-clip">

<!-- Menu: lo disegna js/layout.js (uguale in tutte le pagine) -->
<div id="menu"></div>

<main id="top" class="pt-[108px] lg:pt-[120px] overflow-x-clip">

  <!-- ============ INTESTAZIONE ============ -->
  <section class="intestazione bg-acc-grigio-chiaro">
    <div class="relative max-w-acc mx-auto px-4 tablet:px-6 pt-14 pb-14 computer:pt-20 computer:pb-20">
      <span class="pillola text-[15px]" data-entra>Stagione 2026/27 · Attività agonistica</span>
      <h1 class="titolo-display text-[46px] sm:text-[76px] tablet:text-[96px] computer:text-[128px] mt-6 max-w-[760px] pr-[20%] computer:pr-0" data-entra>Le <span class="titolo-contorno">squadre</span></h1>
      <p class="text-[18px] leading-relaxed max-w-[560px] mt-5 pr-[18%] computer:pr-0 text-acc-testo-2" data-entra>Prima squadra in Seconda Categoria, Juniores nel Campionato Regionale Under 19, Allievi e Giovanissimi nei campionati provinciali cremonesi.</p>
      <img class="hidden computer:block absolute right-[7%] top-1/2 -translate-y-1/2 h-[300px] w-auto drop-shadow-acc-stemma" src="assets/logo/stemma-400.png" alt="" />
    </div>
  </section>

  <!-- ============ SCHEDE DELLE SQUADRE ============ -->
  <!-- barra fissa sotto il menu: "top" segue il menu, che scorrendo giù si accorcia (classe menu-ridotto sul body,
       la mette js/layout.js). Su telefono le 4 schede stanno su una riga (testo più piccolo). -->
  <nav id="barraSquadre" class="sticky top-[108px] lg:top-[120px] [.menu-ridotto_&]:top-[70px] lg:[.menu-ridotto_&]:top-[82px] transition-[top] duration-300 z-30 bg-white/95 backdrop-blur border-b border-acc-linea" aria-label="Vai alla squadra">
    <div class="max-w-acc mx-auto px-4 tablet:px-6 py-2.5">
      <div id="indiceSquadre" class="schede max-tablet:!flex-nowrap max-tablet:justify-between max-tablet:!gap-0"></div>
    </div>
  </nav>

  <!-- Le schede delle squadre: le scrive js/pagine/squadre.js da js/dati/squadre.js -->
  <div id="elencoSquadre"></div>

</main>

<!-- Partner e footer: li disegna js/layout.js -->
<div id="partner"></div>
<div id="piede"></div>
