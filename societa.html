<html lang="it">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Società — A.C. Castelverde</title>
<meta name="description" content="L'A.C. Castelverde dal 1987: la storia, il consiglio direttivo e gli impianti." />
<link rel="icon" href="assets/logo/favicon-32.png" type="image/png" />
<link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png" />
<meta name="theme-color" content="#ff0000" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="A.C. Castelverde" />
<meta property="og:title" content="Società — A.C. Castelverde" />
<meta property="og:description" content="L'A.C. Castelverde dal 1987: la storia, il consiglio direttivo e gli impianti." />

<script>if (!/[?&]statico/.test(location.search) && !matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("js-animazioni");</script>
<link rel="stylesheet" href="design-system/colori.css?v=1" />
<script src="design-system/tema-tailwind.js?v=1"></script>
<script src="js/vendor/tailwind-browser.js"></script>
<link rel="stylesheet" href="css/componenti.css?v=1" />
<link rel="stylesheet" href="css/sito.css?v=1" />

</head>
<body data-pagina="societa" class="bg-acc-carta text-acc-inchiostro antialiased overflow-x-clip">

<!-- Menu: lo disegna js/layout.js (uguale in tutte le pagine) -->
<div id="menu"></div>

<main id="top" class="pt-[108px] lg:pt-[120px] overflow-x-clip">

  <!-- ============ INTESTAZIONE ============ -->
  <section class="intestazione bg-acc-grigio-chiaro">
    <div class="relative max-w-acc mx-auto px-4 tablet:px-6 pt-14 pb-14 computer:pt-20 computer:pb-20">
      <span class="pillola text-[15px]" data-entra>Associazione Calcio Castelverde A.S.D.</span>
      <h1 class="titolo-display text-[46px] sm:text-[76px] tablet:text-[96px] computer:text-[128px] mt-6 max-w-[760px] pr-[20%] computer:pr-0" data-entra>Cresciamo <span class="titolo-contorno">insieme</span></h1>
      <p class="text-[18px] leading-relaxed max-w-[560px] mt-5 pr-[18%] computer:pr-0 text-acc-testo-2" data-entra>Dal luglio 1987 il calcio di Castelverde. Oggi quattro squadre agonistiche, dalla Seconda Categoria agli Under 15.</p>
      <img class="hidden computer:block absolute right-[7%] top-1/2 -translate-y-1/2 h-[300px] w-auto drop-shadow-acc-stemma" src="assets/logo/stemma-400.png" alt="" />
    </div>
  </section>

  <!-- ============ NUMERI ============ -->
  <section class="trama-rossa py-12">
    <div id="numeri" class="max-w-acc mx-auto px-4 tablet:px-6 grid grid-cols-2 computer:grid-cols-4 gap-4" data-entrano></div>
  </section>

  <!-- ============ LA NOSTRA STORIA (linea del tempo da js/dati/storia.js) ============ -->
  <section id="storia" class="py-16 computer:py-24 scroll-mt-[120px]">
    <div class="max-w-acc mx-auto px-4 tablet:px-6">
      <h2 class="titolo-sezione text-[40px] tablet:text-[80px] mb-10 tablet:mb-14" data-entra>La nostra storia</h2>
      <!-- linea grigia verticale (before:) e linea rossa che si riempie scorrendo
           (linea-tempo__progresso, la anima js/animazioni.js): a sinistra su smartphone, al centro da computer -->
      <div class="linea-tempo relative before:absolute before:inset-y-0 before:left-[15px] before:w-1 before:bg-acc-grigio computer:before:left-1/2 computer:before:-ml-0.5">
        <span class="linea-tempo__progresso absolute top-0 left-[15px] w-1 h-0 bg-acc-rosso computer:left-1/2 computer:-ml-0.5" aria-hidden="true"></span>
        <ol id="lineaTempo" class="list-none p-0 m-0 flex flex-col gap-14"></ol>
      </div>
    </div>
  </section>

  <!-- ============ RIMANDO ALLA DIRIGENZA ============ -->
  <section class="trama-grigia py-16 computer:py-20">
    <a href="dirigenza.html" class="group max-w-acc mx-auto px-4 tablet:px-6 flex flex-wrap items-center justify-between gap-6 no-underline text-acc-nero" data-entra>
      <span>
        <span class="pillola text-[15px]">Chi guida la società</span>
        <span class="block titolo-display text-[64px] tablet:text-[96px] mt-5">La <span class="titolo-contorno group-hover:text-acc-rosso transition-colors">dirigenza</span></span>
      </span>
      <span class="btn btn--rosso">Scopri la dirigenza <span class="w-4 h-4">→</span></span>
    </a>
  </section>

  <!-- ============ IMPIANTI (da CLUB.impianti in js/dati/club.js) ============ -->
  <section id="impianti" class="py-16 computer:py-24 scroll-mt-[120px]">
    <div class="max-w-acc mx-auto px-4 tablet:px-6">
      <h2 class="titolo-sezione text-[40px] tablet:text-[80px] mb-8 tablet:mb-12" data-entra>Il nostro campo</h2>
      <div id="elencoImpianti" class="grid gap-8 max-w-[760px]" data-entrano></div>
    </div>
  </section>

</main>

<!-- Partner e footer: li disegna js/layout.js -->
<div id="partner"></div>
<div id="piede"></div>

<script src="js/vendor/gsap.min.js"></script>
<script src="js/vendor/ScrollTrigger.min.js"></script>
<script src="js/dati/club.js?v=1"></script>
<script src="js/dati/notizie.js?v=1"></script>
<script src="js/dati/squadre.js?v=1"></script>
<script src="js/dati/partite.js?v=1"></script>
<script src="js/dati/partner.js?v=1"></script>
<script src="js/dati/storia.js?v=1"></script>
<script src="js/utilita.js?v=1"></script>
<script src="js/componenti.js?v=1"></script>
<script src="js/layout.js?v=1"></script>
<script src="js/animazioni.js?v=4"></script>
<script src="js/pagine/societa.js?v=9"></script>
</body>
</html>
